# Host metadata for skill rendering.
# Each host defines how skills are rendered and installed.
# Used by scripts/render-host-skills.py to produce host-specific output.

hosts:
  claude:
    host_id: claude
    config_dir: "~/.claude"
    header_filename: CLAUDE.md
    destination_dir: ".claude"
    instruction_surface: header_embedded
    install_enabled: true
  codex:
    host_id: codex
    config_dir: "~/.codex"
    header_filename: AGENTS.md
    destination_dir: ".codex"
    instruction_surface: header_embedded
    install_enabled: true
  copilot:
    host_id: copilot
    config_dir: null
    header_filename: copilot-instructions.md
    destination_dir: ".github"
    instruction_surface: copilot_instructions_md
    install_enabled: true
  cursor:
    host_id: cursor
    config_dir: "~/.cursor"
    header_filename: sopify.mdc
    destination_dir: ".cursor"
    instruction_surface: user_plugin
    instruction_source_relpath: cursor-plugin-rule.mdc.template
    install_enabled: true
  qoder:
    host_id: qoder
    config_dir: "~/.qoder"
    header_filename: AGENTS.md
    destination_dir: ".qoder"
    instruction_surface: header_embedded
    install_enabled: true
  antigravity:
    host_id: antigravity
    config_dir: "~/.gemini/config"
    header_filename: AGENTS.md
    destination_dir: ".gemini/config"
    instruction_surface: header_embedded
    flat_skills: true
    install_enabled: true
  trae:
    host_id: trae
    config_dir: "~/.trae"
    header_filename: skills/sopify/SKILL.md
    destination_dir: ".trae"
    instruction_surface: header_embedded
    flat_skills: true
    entry_skill_template: skills/trae-entry-skill.md.template
    install_enabled: true
